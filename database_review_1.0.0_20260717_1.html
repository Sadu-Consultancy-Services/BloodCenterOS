function build() {
  let totalTables = 0;
  const sectionsEl = document.getElementById('sections');

  // Count SPs by scanning all map entries
  function countAllSps() {
    let n = 0;
    for (const k in SP_MAP) {
      if (k !== '_shared_reports' && Array.isArray(SP_MAP[k])) n += SP_MAP[k].length;
    }
    n += (SP_MAP._shared_reports || []).length;
    return n;
  }

  DATA.modules.forEach(mod => {
    const sec = document.createElement('div');
    sec.className = 'section';
    totalTables += mod.tables.length;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<span>${mod.name}</span><span class="count">${mod.tables.length} tables</span>`;
    header.addEventListener('click', () => { body.classList.toggle('open'); });

    const body = document.createElement('div');
    body.className = 'section-body';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th style="width:18%">Table</th><th style="width:28%">Description</th><th style="width:54%">Stored Procedures</th></tr>';
    table.appendChild(thead);
    const tbody = document.createElement('tbody');

    mod.tables.forEach(t => {
      const sps = SP_MAP[t.name] || [];
      const row = document.createElement('tr');
      let spHtml = '';

      // Base SPs for this table
      let displaySps = [...sps];

      // Add shared report SPs to relevant tables
      if (t.name === 'DonorMaster') {
        const r = (SP_MAP._shared_reports || []).filter(s => s.name.includes('donor'));
        displaySps = displaySps.concat(r);
      } else if (t.name === 'InventoryStock') {
        const r = (SP_MAP._shared_reports || []).filter(s => s.name.includes('inventory'));
        displaySps = displaySps.concat(r);
      } else if (t.name === 'BloodCampMaster') {
        const r = (SP_MAP._shared_reports || []).filter(s => s.name.includes('camp'));
        displaySps = displaySps.concat(r);
      }

      if (displaySps.length > 0) {
        spHtml = '<ul class="sp-list">';
        displaySps.forEach(sp => {
          spHtml += `<li><code class="sname">${sp.name}</code> <span class="sp-desc">${sp.desc}</span></li>`;
        });
        spHtml += '</ul>';
      } else {
        spHtml = '<span class="empty">No stored procedures (read-only reference or log table)</span>';
      }

      row.innerHTML = `
        <td><span class="tname">${t.name}</span></td>
        <td class="desc">${t.desc}</td>
        <td>${spHtml}</td>
      `;
      tbody.appendChild(row);
    });

    table.appendChild(tbody);
    body.appendChild(table);
    sec.appendChild(header);
    sec.appendChild(body);
    sectionsEl.appendChild(sec);
  });

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${totalTables}</div><div class="lbl">Tables</div></div>
    <div class="stat-card"><div class="num">${countAllSps()}</div><div class="lbl">Stored Procedures</div></div>
    <div class="stat-card"><div class="num">${DATA.modules.length}</div><div class="lbl">Modules</div></div>
  `;
}

document.addEventListener('DOMContentLoaded', build);
</script>
